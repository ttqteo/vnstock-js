name: Integration

# Tests that call the real VCI / commodity APIs. Kept out of CI so upstream
# outages never turn a contributor's pull request red.
on:
  schedule:
    # 10:00 UTC = 17:00 ICT, weekdays, after the VN market closes
    - cron: "0 10 * * 1-5"
  workflow_dispatch:

jobs:
  integration:
    name: Live API tests
    runs-on: ubuntu-latest
    # Upstream sources hang rather than refuse from non-VN IPs, so cap the run
    # instead of letting a stuck request burn the default 6h budget.
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Integration tests
        run: npm run test:integration

      - name: Report upstream breakage
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const title = "Integration tests failing: upstream API may have changed";
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: "open",
              labels: "upstream",
            });
            const url = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            if (existing.some((i) => i.title === title)) {
              const open = existing.find((i) => i.title === title);
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: open.number,
                body: `Still failing on ${new Date().toISOString().slice(0, 10)}. [Run log](${url})`,
              });
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              labels: ["upstream", "bug"],
              body: [
                "The scheduled integration run failed. This usually means an upstream",
                "endpoint changed its response shape, started rate limiting, or went down.",
                "",
                `[Run log](${url})`,
                "",
                "Reproduce locally with `npm run test:integration`.",
              ].join("\n"),
            });
